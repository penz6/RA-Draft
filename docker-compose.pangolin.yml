version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ra-draft:latest
    container_name: ra-draft
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: false
    tmpfs:
      - /tmp:size=32M,mode=1777
      - /dev/shm:size=64M,mode=1777
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1024M
        reservations:
          cpus: '0.25'
          memory: 128M
    environment:
      - FLASK_ENV=production
      - DATABASE_PATH=/app/data/ra_draft.db
      - SECRET_KEY=${SECRET_KEY}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - ADMIN_EMAILS=${ADMIN_EMAILS}
      - BASE_URL=${BASE_URL:-https://ra-draft.example.com}
    volumes:
      - ra_draft_data:/app/data
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  ra_draft_data:
    name: ra_draft_data
