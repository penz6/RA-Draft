services:
  ra-draft:
    image: ghcr.io/penz6/ra-draft:latest
    restart: unless-stopped
    environment:
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      PUBLIC_HOST: ${PUBLIC_HOST:?Set PUBLIC_HOST in .env}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?Set GOOGLE_CLIENT_ID in .env}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?Set GOOGLE_CLIENT_SECRET in .env}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      PROXY_HOPS: ${PROXY_HOPS:-1}
      DATABASE_PATH: /data/ra_draft.db
      WEB_THREADS: ${WEB_THREADS:-32}
      AUDIT_LOG_MAX_ROWS: ${AUDIT_LOG_MAX_ROWS:-5000}
    volumes:
      - ra-draft-data:/data
    expose:
      - "8000"
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - pangolin

volumes:
  ra-draft-data:

networks:
  pangolin:
    external: true
    name: ${PANGOLIN_NETWORK:-pangolin}
