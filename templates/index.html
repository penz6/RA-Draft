{% extends "base.html" %}
{% block title %}RWU Scheduler{% endblock %}
{% block head %}
<style>
#logo { opacity: 0; animation: fadeIn 2s forwards; }
@keyframes fadeIn { to { opacity: 1; } }
.center a { display: block; margin-top: 20px; }
</style>
{% endblock %}
{% block content %}
<div class="center">
  <img id="logo" src="{{ url_for('static', filename='hawk.svg') }}" alt="RWU Logo" width="200">
  <a class="button" href="{{ url_for('host_login') }}">Host Login</a>
  <a class="button" href="{{ url_for('join') }}">Join Room</a>
</div>
{% endblock %}
