{% extends 'base.html' %}
{% block title %}RA Duty Picking{% endblock %}
{% block content %}
<div class="login-wrapper">
  <section class="login-card card">
    <h1>RA Duty Picking</h1>
    {% if me %}
    <a class="button large" href="{{ url_for('dashboard') }}">Open portal</a>
    {% else %}
    <a class="button large" href="{{ url_for('login') }}">Continue with Google</a>
    <a class="button ghost login-prostaff-button" href="{{ url_for('prostaff_login') }}">Prostaff sign in</a>
    {% endif %}
    <p class="login-note">RA and HRA accounts use RWU Google sign in.</p>
  </section>
</div>
{% endblock %}
