{% extends "base.html" %}
{% block title %}Pick Date{% endblock %}
{% block content %}
<h2>{{ name }}, pick a date</h2>
<div>Time remaining: <span id="timer">30</span>s</div>
{% if up_next %}<div>Up next: {{ up_next }}</div>{% endif %}
<form method="post" id="pickForm">
  <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
  <input type="hidden" name="dates" id="selectedDates">
  <div id="calendar" class="table-style"></div>
  <button type="submit">Submit Picks</button>
</form>
{% endblock %}
{% block scripts %}
<script>
const start = new Date("{{ start }}");
const end = new Date("{{ end }}");
const picks = {{ picks|tojson }};
const allowed = new Set({{ allowed|tojson }});
const selected = new Set();

function buildCalendar(){
  let current = new Date(start);
  current.setDate(1);
  const calendar = document.getElementById('calendar');
  calendar.innerHTML = '';
  while(current <= end){
    const month = current.getMonth();
    const table = document.createElement('table');
    const caption = document.createElement('caption');
    caption.textContent = current.toLocaleString('default',{month:'long',year:'numeric'});
    table.appendChild(caption);
    const header = document.createElement('tr');
    ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].forEach(d=>{
      const th=document.createElement('th');
      th.textContent=d;
      header.appendChild(th);
    });
    table.appendChild(header);
    let row=document.createElement('tr');
    for(let i=0;i<current.getDay();i++){ row.appendChild(document.createElement('td')); }
    while(current.getMonth()===month && current<=end){
      const iso=current.toISOString().slice(0,10);
      const cell=document.createElement('td');
      cell.textContent=current.getDate();
      const day=current.getDay();
      if(day===5||day===6){ cell.classList.add('weekend'); } else { cell.classList.add('weekday'); }
      if(picks[iso]){
        picks[iso].forEach(n=>{
          const s=document.createElement('span');
          s.className='pick';
          s.textContent=n[0].toUpperCase();
          s.title=n;
          cell.appendChild(s);
        });
        if(picks[iso].length>=2){ cell.classList.add('full'); }
      }
      if(!cell.classList.contains('full') && allowed.has(iso)){
        cell.classList.add('selectable');
        cell.addEventListener('click', ()=>{
          if(selected.has(iso)){
            selected.delete(iso);
            cell.classList.remove('chosen');
          } else {
            selected.add(iso);
            cell.classList.add('chosen');
          }
        });
      } else {
        cell.classList.add('full');
      }
      row.appendChild(cell);
      if(current.getDay()===6){ table.appendChild(row); row=document.createElement('tr'); }
      current.setDate(current.getDate()+1);
    }
    if(row.children.length){
      while(row.children.length<7){ row.appendChild(document.createElement('td')); }
      table.appendChild(row);
    }
    calendar.appendChild(table);
  }
}
buildCalendar();

let t = 30;
const timerEl = document.getElementById('timer');
const form = document.getElementById('pickForm');
const audioCtx = new (window.AudioContext||window.webkitAudioContext)();
function beep(){
  const osc=audioCtx.createOscillator();
  osc.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime+0.1);
}
form.addEventListener('submit', ()=>{
  document.getElementById('selectedDates').value = Array.from(selected).join(',');
});
const countdown=setInterval(()=>{
  t--;
  timerEl.textContent=t;
  if(t<=10){ timerEl.classList.add('flash'); beep(); }
  if(t<=0){ clearInterval(countdown); form.submit(); }
},1000);
</script>
{% endblock %}
