<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}RA Draft{% endblock %}</title>
</head>
<body style="margin:0;padding:0;background:#f3f6fb;color:#172033;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;">
  <div style="display:none;max-height:0;overflow:hidden;opacity:0;color:transparent;">{% block preheader %}RA Draft notification{% endblock %}</div>
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="width:100%;background:#f3f6fb;margin:0;padding:0;">
    <tr>
      <td align="center" style="padding:32px 16px;">
        <table role="presentation" width="600" cellspacing="0" cellpadding="0" border="0" style="width:100%;max-width:600px;background:#ffffff;border-radius:18px;overflow:hidden;box-shadow:0 8px 30px rgba(20,33,61,0.10);">
          <tr>
            <td style="padding:26px 30px;background:#172033;color:#ffffff;">
              <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0">
                <tr>
                  <td valign="middle" style="width:54px;">
                    <div style="width:44px;height:44px;line-height:44px;text-align:center;border-radius:12px;background:#ffffff;color:#172033;font-size:18px;font-weight:800;letter-spacing:-0.5px;">RA</div>
                  </td>
                  <td valign="middle">
                    <div style="font-size:22px;line-height:28px;font-weight:800;letter-spacing:-0.4px;">RA Draft</div>
                    <div style="font-size:13px;line-height:19px;color:#c9d2e3;">Residence Life duty scheduling</div>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td style="padding:32px 30px 28px;">
              {% block content %}{% endblock %}
            </td>
          </tr>
          <tr>
            <td style="padding:20px 30px;background:#f8fafc;border-top:1px solid #e8edf5;color:#6c768a;font-size:12px;line-height:18px;text-align:center;">
              This message was sent automatically by <strong style="color:#465066;">RA Draft</strong>.<br>
              Sign in to RA Draft to view the latest official duty schedule.
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
