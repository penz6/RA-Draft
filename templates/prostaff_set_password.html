{% extends 'base.html' %}{% block title %}Set your password{% endblock %}{% block content %}
<div class="login-wrapper"><section class="login-card card prostaff-login-card">
  <div class="eyebrow">First sign in</div><h1>Set your password</h1><p>Create a private password with at least 12 characters.</p>
  <form method="post" class="prostaff-login-form"><input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <label class="field">New password<input type="password" name="password" minlength="12" maxlength="128" required autocomplete="new-password"></label>
    <label class="field">Confirm password<input type="password" name="password_confirm" minlength="12" maxlength="128" required autocomplete="new-password"></label>
    <button class="button large" type="submit">Set password</button>
  </form>
</section></div>{% endblock %}
