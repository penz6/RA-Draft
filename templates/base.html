<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}RA Draft{% endblock %}</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body><header class="topbar"><a href="{{ url_for('dashboard') if me else url_for('index') }}" class="brand">RA Draft</a>{% if me %}<nav><span>{{ me.name }} · {{ me.role }}</span>{% if me.role == 'ADMIN' %}<a href="{{ url_for('admin') }}">Admin</a>{% endif %}</nav>{% endif %}</header><main class="container">{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main></body>
</html>
