<h3>HRA manual assignment</h3>
<p class="muted">Assign or correct any participating RA. A manual assignment also clears a deferred turn.</p>
{% for p in people %}
<form class="inline edit-row" method="post" action="{{ url_for('manual_assign', session_id=draft.id) }}">
<input type="hidden" name="csrf" value="{{ csrf_token() }}">
<input type="hidden" name="user_id" value="{{ p.id }}">
<strong>{{ p.name }}{% if p.deferred %} <span class="muted">(deferred)</span>{% endif %}</strong>
<select name="duty_date"><option value="">Unassigned</option>{% for d in dates %}<option value="{{ d }}" {% if p.duty_date == d %}selected{% endif %}>{{ d }}</option>{% endfor %}</select>
<button class="button small">Save</button>
</form>
{% endfor %}
<form method="post" action="{{ url_for('session_status', session_id=draft.id) }}">
<input type="hidden" name="csrf" value="{{ csrf_token() }}">
<input type="hidden" name="status" value="{{ 'CLOSED' if draft.status == 'OPEN' else 'OPEN' }}">
<button class="button secondary">{{ 'Close' if draft.status == 'OPEN' else 'Reopen' }} session</button>
</form>
