{% extends "base.html" %}
{% block title %}Create Room{% endblock %}
{% block content %}
<h2>Create Room</h2>
<form method="post">
  <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
  <label>Start Date: <input type="date" name="start" required></label><br>
  <label>End Date: <input type="date" name="end" required></label><br>
  <button type="submit">Create</button>
</form>
{% endblock %}
